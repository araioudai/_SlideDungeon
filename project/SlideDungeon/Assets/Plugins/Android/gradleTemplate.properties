org.gradle.parallel=true
unityStreamingAssets=**STREAMING_ASSETS**

#Android Resolver Properties Start
android.useAndroidX=true
android.enableJetifier=true
#Android Resolver Properties End

#Unityが動的にプロパティを追加するためのプレースホルダー
# Android Resolver Properties Start
android.useAndroidX=true
android.enableJetifier=true
# Android Resolver Properties End
**ADDITIONAL_PROPERTIES**

# カスタム最適化設定
#メモリとスタックサイズの設定（ヒープを4GB、スタックを4MBにしてStackOverflowを防止）
org.gradle.jvmargs=-Xmx4096m -Xss4m

#Jetifierの無視リスト（競合を防ぐため、必要なライブラリを1行にまとめて指定）
android.jetifier.ignorelist=kotlin-stdlib,kotlinx-coroutines-core,kotlinx-coroutines-android,annotation-experimental-1.4.0.aar

#Android SDK 35（Android 15）向けのビルド警告・エラー抑制
android.suppressUnsupportedCompileSdk=35

#リリースビルド時のLint（コードチェック）によるビルド中断を防止
android.lintOptions.checkReleaseBuilds=false
android.lintOptions.abortOnError=false
android.jetifier.ignorelist=annotation-experimental-1.4.0.aar
android.enableDexingArtifactTransform=false